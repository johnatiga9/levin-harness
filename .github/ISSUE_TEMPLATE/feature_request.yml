name: Feature request / 功能建议
description: Describe a workflow or improvement you need. 欢迎使用中文或英文。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese suggestions are welcome. Please search existing issues before submitting.
        欢迎使用中文或英文建议，提交前请先搜索已有议题。

        Issues are public. Use sanitized examples and omit credentials, personal information, and confidential research data.
        议题公开可见。请使用脱敏样例，勿提供密钥、个人信息及机密研究数据。
  - type: textarea
    id: workflow
    attributes:
      label: Research workflow / 科研工作流
      description: What task are you trying to complete, and who is it for? 您希望完成什么任务，面向哪些用户？
    validations:
      required: true
  - type: textarea
    id: obstacle
    attributes:
      label: Current obstacle / 当前障碍
      description: Describe the current steps, what is missing, and any workaround you use. 请说明当前步骤、缺少的能力及现有替代办法。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome / 期望结果
      description: What would a successful result look like? 请说明怎样才算成功完成任务。
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example or context / 样例或补充信息
      description: Optional. Add a sanitized example, expected inputs and outputs, or how often this workflow occurs. 选填，可附上脱敏样例、预期输入输出或使用频率。
